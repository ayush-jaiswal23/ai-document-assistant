services:
  - type: web
    name: ai-document-assistant-api
    runtime: python
    plan: free
    region: oregon
    branch: testing
    autoDeploy: true
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: cd backend && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ai-document-assistant-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://ai-document-assistant-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://ai-document-assistant-web.onrender.com
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-document-assistant-db
          property: connectionString

  - type: web
    name: ai-document-assistant-web
    runtime: static
    plan: free
    region: oregon
    branch: testing
    autoDeploy: true
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_MODE
        value: backend
      - key: VITE_API_BASE_URL
        value: https://ai-document-assistant-api.onrender.com

databases:
  - name: ai-document-assistant-db
    databaseName: ai_document_assistant
    user: ai_document_assistant
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
